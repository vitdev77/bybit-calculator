name: Next.js CI/CD Operations

# Пайплайн запускается при пушах и пулл-реквестах в основные ветки
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  code-verification:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x] # Используем Node.js 24 для полного соответствия серверам GitHub

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js environment (${{ matrix.node-version }})
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm" # Кешируем зависимости для ускорения последующих проверок
      - name: Install project dependencies
        run: npm ci # Чистая установка пакетов строго по package-lock.json

      - name: Run ESLint static analysis
        run: npm run lint
        continue-on-error: true # Линтер не уронит проверку, даже если найдет мелкие варнинги

      - name: Execute production build test
        run: npm run build
        env:
          # Передаем заглушки переменных окружения, чтобы локальный компилятор прошел билд успешно
          DATABASE_URL: "postgresql://mock_user:mock_pass@localhost:5432/mock_db"
          BYBIT_API_URL: "https://api.bytick.com"
          NEXT_PUBLIC_TRADINGVIEW_SCRIPT_URL: "https://s3.tradingview.com/tv.js"
